# 本文件只用于本地开发：只启动 PostgreSQL 数据库，前后端在本地运行。
name: goodhr5-local

services:
  # PostgreSQL 数据库，端口 25432 映射到容器 5432
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_USER: goodhr5_dev
      POSTGRES_PASSWORD: goodhr5_dev
      POSTGRES_DB: goodhr5_dev
    ports:
      - "25432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data-services
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goodhr5_dev -d goodhr5_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  data-services:
    name: data-services
    driver: bridge

volumes:
  postgres_data:
