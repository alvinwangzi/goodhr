# 本文件提供 GoodHR 5 生产环境完整的 Nginx 站点配置示例（含 HTTPS）。
#
# 用法：
#   1. 把文件里的 your-domain.com 全部替换成你的正式域名。
#   2. 复制到服务器： /etc/nginx/sites-available/goodhr5.conf
#   3. 建立软链： ln -s /etc/nginx/sites-available/goodhr5.conf /etc/nginx/sites-enabled/
#   4. 先用 certbot 申请证书（见部署手册），证书路径与下面 ssl_certificate 保持一致。
#   5. 校验并重载： nginx -t && systemctl reload nginx
#
# 反代目标对应 docker-compose.prod.yml 发布到宿主机 127.0.0.1 的端口：
#   后端 127.0.0.1:8084，前端 127.0.0.1:5173。

# HTTP：仅用于放行证书验证请求，其余全部跳转到 HTTPS。
server {
    listen 80;
    server_name your-domain.com;

    # Let's Encrypt / certbot 续期验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS：正式对外服务
server {
    listen 443 ssl;
    server_name your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 允许上传较大的文件（如邮件图片、安装包等）
    client_max_body_size 50m;

    # 后端 API：/api/ 与本地程序上传/下载目录 /uploads/ 都转发到 Go 后端。
    location /api/ {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 升级（本地 Agent 与后端长连接必需）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
        gzip off;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其余全部走 Next.js 前端
    location ^~ / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
